# Static serving for the Vite build output (dist/).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Relative redirects so port mappings (e.g. 8080:80) never leak :80 into Location.
    absolute_redirect off;

    # The CSP ships as a meta tag in index.html; these headers complement it.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # Vite's content-hashed bundles never change -> cache for a year.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        expires 1y;
        try_files $uri =404;
    }

    # Unhashed public assets (portrait, flag, emblem, CV, audio) -> revalidate hourly.
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    # HTML and everything else -> always revalidate so deploys show immediately.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Styled 404 page (built from 404.html), served with a real 404 status.
    error_page 404 /404.html;
    location = /404.html {
        expires -1;
    }

    location ~ /\. {
        deny all;
    }
}